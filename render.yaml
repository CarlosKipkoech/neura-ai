services:
  - type: web
    name: neura-ai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: EXTRA_CORS_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/neura.db
      - key: QDRANT_PATH
        value: /var/data/qdrant.db
    disk:
      name: neura-data
      mountPath: /var/data
      sizeGB: 1
