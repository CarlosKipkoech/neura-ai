app = "neura-ai-api"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  FRONTEND_URL = "https://carloskipkoech.github.io"
  EXTRA_CORS_ORIGINS = "https://carloskipkoech.github.io,https://carloskipkoech.github.io/neura-ai"
  DATABASE_PATH = "/tmp/neura/neura.db"
  QDRANT_PATH = "/tmp/neura/qdrant.db"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
